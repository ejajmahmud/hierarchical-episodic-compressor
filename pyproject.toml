[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-episodic-compressor"
version = "0.1.0"
description = "Multi-scale episodic compressor consolidating granular agent turns into structured hierarchical milestones"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
hierarchical-episodic-compressor = "hierarchical_episodic_compressor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hierarchical_episodic_compressor*"]
